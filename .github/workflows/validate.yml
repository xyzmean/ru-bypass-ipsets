name: Validate lists

on:
  pull_request:
    paths:
      - 'lists/**'
      - 'generator/**'
  # Прямой push в main — основной путь изменений в этом репозитории (PR здесь не
  # заводятся), и без этого триггера проверка не запускалась вовсе там, где нужнее всего.
  push:
    branches: [main]
    paths:
      - 'lists/**'
      - 'generator/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate .lst format
        run: |
          set -e
          fail=0
          CIDR_RE='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/(3[0-2]|[12]?[0-9])$'
          for f in lists/*.lst; do
            [ -f "$f" ] || continue
            # 1) каждая строка — валидный IPv4 CIDR
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if ! [[ "$line" =~ $CIDR_RE ]]; then
                echo "::error file=$f::невалидная строка: $line"
                fail=1
              fi
            done < "$f"
            # 2) октеты 0–255
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              IFS=/ read -r ip prefix <<< "$line"
              IFS=. read -r o1 o2 o3 o4 <<< "$ip"
              for o in "$o1" "$o2" "$o3" "$o4"; do
                if [ "$o" -gt 255 ] 2>/dev/null; then
                  echo "::error file=$f::октет >255: $line"
                  fail=1
                fi
              done
            done < "$f"
            # 3) сортировка (численная для IP через -V)
            if ! diff -q <(sort -V "$f") "$f" >/dev/null 2>&1; then
              echo "::warning file=$f::не отсортирован (требуется -V порядок)"
            fi
            # 4) дедуп
            dup=$(sort "$f" | uniq -d | head -3)
            if [ -n "$dup" ]; then
              echo "::error file=$f::дубликаты: $dup"
              fail=1
            fi
            echo "✓ $f ($(wc -l < "$f") строк)"
          done
          exit $fail

      # setup-python здесь появился вместе с self-check: шаг ниже уже вызывал `python`,
      # но джоб никогда не проверялся на практике — validate.yml запускался только на
      # pull request, а в этом репозитории коммитят прямо в main.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-check (схема, списки против схемы, манифест)
        run: |
          pip install -q requests
          python generator/selfcheck.py

      - name: Validate categories.json
        run: |
          python -c "
          import json, sys
          d = json.load(open('lists/categories.json'))
          assert 'categories' in d and 'aggregates' in d
          assert d['categories'], 'пустые категории'
          ids = {c['id'] for c in d['categories']}
          for c in d['categories']:
              for k in ('id','name_ru','description_ru','file','default_on','is_geoblock','count'):
                  assert k in c, f'категория {c} без {k}'
              # same_prefixes_as: «тот же набор префиксов, что у …». Симметрично, ведёт на
              # существующие категории и всегда с причиной для интерфейса.
              for other in c.get('same_prefixes_as', []):
                  assert other in ids, f'{c["id"]}: same_prefixes_as → неизвестный {other}'
                  assert c.get('same_prefixes_reason_ru'), f'{c["id"]}: нет same_prefixes_reason_ru'
          for dl in d.get('domain_lists', []):
              up = dl.get('upstream')
              assert isinstance(up, dict), f'доменный список {dl["id"]} без upstream'
              assert up.get('editable_locally') is False, f'{dl["id"]}: upstream.editable_locally != false'
              assert up.get('url') and up.get('suggest_url'), f'{dl["id"]}: upstream без ссылок'
          print('categories.json OK:', len(d['categories']), 'категорий,',
                len(d.get('domain_lists', [])), 'доменных списков')
          "
