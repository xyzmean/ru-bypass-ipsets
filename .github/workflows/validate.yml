name: Validate lists

on:
  pull_request:
    paths:
      - 'lists/**'
      - 'generator/**'
      - 'tests/**'
  # Прямой push в main — основной путь изменений в этом репозитории (PR здесь не
  # заводятся), и без этого триггера проверка не запускалась вовсе там, где нужнее всего.
  push:
    branches: [main]
    paths:
      - 'lists/**'
      - 'generator/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate .lst format
        run: |
          set -e
          fail=0
          CIDR_RE='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/(3[0-2]|[12]?[0-9])$'
          for f in lists/*.lst; do
            [ -f "$f" ] || continue
            # 1) каждая строка — валидный IPv4 CIDR
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if ! [[ "$line" =~ $CIDR_RE ]]; then
                echo "::error file=$f::невалидная строка: $line"
                fail=1
              fi
            done < "$f"
            # 2) октеты 0–255
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              IFS=/ read -r ip prefix <<< "$line"
              IFS=. read -r o1 o2 o3 o4 <<< "$ip"
              for o in "$o1" "$o2" "$o3" "$o4"; do
                if [ "$o" -gt 255 ] 2>/dev/null; then
                  echo "::error file=$f::октет >255: $line"
                  fail=1
                fi
              done
            done < "$f"
            # 3) сортировка (численная для IP через -V)
            if ! diff -q <(sort -V "$f") "$f" >/dev/null 2>&1; then
              echo "::warning file=$f::не отсортирован (требуется -V порядок)"
            fi
            # 4) дедуп
            dup=$(sort "$f" | uniq -d | head -3)
            if [ -n "$dup" ]; then
              echo "::error file=$f::дубликаты: $dup"
              fail=1
            fi
            echo "✓ $f ($(wc -l < "$f") строк)"
          done
          exit $fail

      # setup-python здесь появился вместе с self-check: шаг ниже уже вызывал `python`,
      # но джоб никогда не проверялся на практике — validate.yml запускался только на
      # pull request, а в этом репозитории коммитят прямо в main.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate own domain sources
        run: |
          set -e
          fail=0
          [ -d sources/domains ] || exit 0
          for f in sources/domains/*.lst; do
            [ -f "$f" ] || continue
            # Строка либо пустая, либо комментарий, либо домен (с возможным «# почему» в
            # конце). Опечатка иначе доедет до публикации молча: домен просто не попадёт
            # в список, а человек будет уверен, что добавил его.
            n=0
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | tr -d '[:space:]')"
              [ -z "$line" ] && continue
              if ! echo "$line" | grep -qE '^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)*\.[a-z]{2,}$'; then
                echo "::error file=$f::не домен: $line"
                fail=1
              else
                n=$((n+1))
              fi
            done < "$f"
            echo "✓ $f ($n доменов)"
          done
          exit $fail

      - name: Self-check (схема, списки против схемы, манифест, наш список)
        run: |
          pip install -q requests
          python generator/selfcheck.py

      # Стенды репозитория. Сюда же попадает автокоммит сборки (`chore(lists):
      # auto-resolve` идёт push'ем в main и трогает lists/**), то есть гейт пустых списков
      # общих прокси проверяется и на опубликованном снапшоте, а не только внутри сборки.
      - name: Стенды (tests/run.sh)
        run: |
          pip install -q -r generator/requirements.txt
          sh tests/run.sh

      - name: Validate categories.json
        run: |
          python -c "
          import json, sys
          d = json.load(open('lists/categories.json'))
          assert 'categories' in d and 'aggregates' in d
          assert d['categories'], 'пустые категории'
          ids = {c['id'] for c in d['categories']}
          for c in d['categories']:
              for k in ('id','name_ru','description_ru','file','default_on','is_geoblock','count'):
                  assert k in c, f'категория {c} без {k}'
              # same_prefixes_as: «тот же набор префиксов, что у …». Симметрично, ведёт на
              # существующие категории и всегда с причиной для интерфейса.
              for other in c.get('same_prefixes_as', []):
                  assert other in ids, f'{c["id"]}: same_prefixes_as → неизвестный {other}'
                  assert c.get('same_prefixes_reason_ru'), f'{c["id"]}: нет same_prefixes_reason_ru'
          # Признак источника у доменного списка обязателен и ровно один: зеркало
          # (upstream, дописать нельзя) либо наш список (maintained_here, дописать
          # можно — сюда). Без него интерфейсу нечего ответить на «домена нет».
          # Обратные кавычки здесь не ставить: шаг целиком — python -c \"...\" в двойных
          # кавычках, и они превратились бы в подстановку команды.
          own = 0
          for dl in d.get('domain_lists', []):
              src = dl.get('upstream') or dl.get('maintained_here')
              assert isinstance(src, dict), f'доменный список {dl["id"]} без признака источника'
              assert not (dl.get('upstream') and dl.get('maintained_here')), f'{dl["id"]}: сразу upstream и maintained_here'
              assert src.get('url') and src.get('suggest_url'), f'{dl["id"]}: признак источника без ссылок'
              if dl.get('maintained_here'):
                  own += 1
                  assert src.get('editable_locally') is True, f'{dl["id"]}: наш список с editable_locally != true'
              else:
                  assert src.get('editable_locally') is False, f'{dl["id"]}: upstream.editable_locally != false'
          # Каждый исходник sources/domains обязан быть опубликован: манифест собирается
          # заново целиком, и потерянная запись выглядит как «списка никогда не было».
          import pathlib
          for f in sorted(pathlib.Path('sources/domains').glob('*.lst')) if pathlib.Path('sources/domains').is_dir() else []:
              cid = 'own_' + f.stem
              assert any(x['id'] == cid for x in d.get('domain_lists', [])), f'{f}: нет записи {cid} в манифесте'
          print('categories.json OK:', len(d['categories']), 'категорий,',
                len(d.get('domain_lists', [])), 'доменных списков, из них наших', own)
          "
