name: Resolve & build lists

on:
  schedule:
    # раз в 3 дня в 03:17 UTC
    - cron: '17 3 */3 * *'
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'generator/**'
      - '.github/workflows/resolve.yml'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: >-
          Состав списков сокращён НАРОЧНО (склейка, переименование, исключение
          источника) — пропустить гейт покрытия на эту одну сборку.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: resolve-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: Run pipeline
        env:
          # Пусто для расписания и для push — гейт покрытия работает. Единицей его
          # выключает человек, который сам и сократил состав списков.
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: |
          cd generator
          python aggregate.py

      # Таблица категорий в README — из свежего манифеста, ДО гейтов и до коммита. Числа в
      # ней проставлялись руками и не двигались: расходились 11 значений из 26, а двух новых
      # категорий не было вовсе (I-084). Руками это не лечится — состав пересобирается раз в
      # три дня, и любое вписанное число неверно уже через сборку. Шаг стоит здесь, а не
      # после гейтов, чтобы стенд tests/gate_readme_table.py сверял README с ТЕМ манифестом,
      # который сейчас публикуется.
      - name: README — таблица категорий из манифеста
        run: python generator/readme_table.py

      # Свежесобранный манифест против свежесобранных списков: не совпало ли что-то
      # новое, не потерялось ли поле. Предупреждениями, а не падением: списки на этот
      # момент уже собраны, и уронить шаг значило бы оставить все роутеры на прошлой
      # сборке из-за расхождения в метаданных. Гейтом остаётся ipsum ниже.
      - name: Self-check манифеста (предупреждения)
        run: python generator/selfcheck.py --warn-only

      - name: Gate — ipsum.lst >= 5000 CIDR
        run: |
          set -e
          n=$(grep -cE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$' lists/ipsum.lst)
          echo "ipsum CIDR count: $n"
          if [ "$n" -lt 5000 ]; then
            echo "::error::ipsum.lst has $n CIDR (< 5000). Keeping previous lists."
            exit 1
          fi

      # Гейт маршрутизации перед публикацией: те же стенды, что и в validate.yml, но в
      # единственном месте, где они видят ОПУБЛИКОВАННЫЕ данные. validate.yml до автокоммита
      # сборки не доезжает вовсе — push под secrets.GITHUB_TOKEN workflow не запускает, и за
      # всю историю ни один выпущенный снапшот ничем оттуда не проверялся (I-108).
      #
      # Здесь стоит ровно то, ошибка в чём портит МАРШРУТИЗАЦИЮ: форма строк, октеты, биты
      # хоста, дубли, частные сети и адреса резолверов (tests/gate_list_format.py), пустой
      # список общего прокси, просадка резолва, покрытие категорий, план ассетов релиза.
      # Метаданные остаются аннотациями шагом выше: уронить публикацию из-за расхождения в
      # описании значит оставить все роутеры на прошлом снапшоте, а маршрутизация от этого
      # расхождения не меняется.
      #
      # Красный шаг здесь означает, что списки НЕ опубликованы: он стоит до коммита, и на
      # диске остаётся только рабочая копия сборщика.
      - name: Гейт маршрутизации — форма списков и стенды
        run: sh tests/run.sh

      - name: Commit lists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Явно вшиваем токен в remote-URL, чтобы git push не шёл анонимно (403).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add lists/ README.md
          if git diff --cached --quiet; then
            echo "Нет изменений — пропуск коммита."
          else
            git commit -m "chore(lists): auto-resolve $(date -u +%Y-%m-%d)"
            git push origin main
          fi

      # Ассеты релиза лежат ПЛОСКО, а lists/ и lists/domains/ пересекаются по именам
      # (geoblock.lst, hodca.lst). Прежняя команда отдавала оба каталога напрямую, GitHub
      # отвергал второй файл с тем же именем (HTTP 422), gh откатывал релиз целиком — и
      # всё это молчала строка «release не создан (возможно уже существует)». Отсюда два
      # изменения: раскладка под уникальными именами и отсутствие `|| echo`. Списки к
      # этому шагу уже закоммичены и запушены, поэтому красный шаг означает ровно то, что
      # случилось: списки опубликованы, релиз — нет.
      - name: Create release
        if: success()
        run: |
          set -e
          tag="$(date -u +%Y-%m-%d_%H-%M)"
          dir="$(python generator/release_assets.py --stage "$RUNNER_TEMP/release-assets")"
          gh release create "$tag" "$dir"/* \
            --title "Lists $tag" \
            --notes "Автоматическая сборка списков. См. lists/categories.json." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
